<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キラー数独ケージ合計制約パズルゲーム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#1a1a2e; }
  .sudoku-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    border: 3px solid #6366f1;
    width: fit-content;
  }
  .cell {
    width: 48px; height: 48px;
    border: 1px solid #374151;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    font-size: 20px; font-weight: bold;
    transition: background 0.15s;
    background: #111827;
    user-select: none;
    box-sizing: border-box;
  }
  .cell:hover { background: #1e3a5f; }
  .cell.selected { background: #1e3a8a !important; }
  .cell.given { color: #93c5fd; cursor: default; }
  .cell.user { color: #4ade80; }
  .cell.error { color: #f87171 !important; background: rgba(220,38,38,0.2) !important; }
  .cell.hint-cell { background: rgba(234,179,8,0.2) !important; }
  .cell.solved-cell { background: rgba(74,222,128,0.1); }
  /* ボックス境界 */
  .cell[data-col="2"], .cell[data-col="5"] { border-right: 2px solid #6366f1; }
  .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid #6366f1; }
  .cell[data-col="0"] { border-left: none; }
  .cell[data-row="0"] { border-top: none; }
  /* ケージ境界 */
  .cell.cage-top    { border-top: 2px dashed #fbbf24 !important; }
  .cell.cage-bottom { border-bottom: 2px dashed #fbbf24 !important; }
  .cell.cage-left   { border-left: 2px dashed #fbbf24 !important; }
  .cell.cage-right  { border-right: 2px dashed #fbbf24 !important; }
  /* ボックス境界はケージより優先 */
  .cell[data-col="2"].cage-right, .cell[data-col="5"].cage-right { border-right: 3px solid #a855f7 !important; }
  .cell[data-row="2"].cage-bottom, .cell[data-row="5"].cage-bottom { border-bottom: 3px solid #a855f7 !important; }
  .cage-label {
    position: absolute; top: 1px; left: 2px;
    font-size: 9px; font-weight: bold; color: #fbbf24;
    line-height: 1;
  }
  .memo {
    display: grid; grid-template-columns: repeat(3,1fr);
    width: 100%; height: 100%;
    padding: 1px;
  }
  .memo span {
    font-size: 8px; color: #9ca3af; text-align: center; line-height: 1.5;
    display: flex; align-items: center; justify-content: center;
  }
  .numpad button {
    width: 44px; height: 44px;
    border-radius: 8px; font-size: 18px; font-weight: bold;
    transition: all 0.15s;
  }
</style>
</head>
<body class="min-h-screen text-gray-200 p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-indigo-300 text-center mb-1">🔢 キラー数独</h1>
  <p class="text-xs text-indigo-500 text-center mb-4">ケージ内の数字の合計がヒントに一致するよう数字を配置せよ</p>

  <div class="flex flex-col lg:flex-row gap-6 justify-center items-start">
    <!-- 左：グリッド -->
    <div>
      <div id="sudokuGrid" class="sudoku-grid shadow-2xl mb-3"></div>
      <div id="errorMsg" class="text-xs text-red-400 text-center h-5"></div>
    </div>

    <!-- 右：コントロール -->
    <div class="space-y-4 min-w-56">
      <!-- 難易度・問題選択 -->
      <div class="bg-gray-900/60 border border-indigo-800/50 rounded-xl p-4 space-y-3">
        <div>
          <label class="text-xs text-indigo-400 block mb-1">難易度</label>
          <select id="diffSelect" onchange="filterPuzzles()" class="w-full bg-gray-800 border border-indigo-700 text-white px-2 py-1.5 rounded text-sm">
            <option value="all">全て</option>
            <option value="easy">易しい</option>
            <option value="medium">普通</option>
            <option value="hard">難しい</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-indigo-400 block mb-1">問題</label>
          <select id="puzzleSelect" onchange="loadPuzzle()" class="w-full bg-gray-800 border border-indigo-700 text-white px-2 py-1.5 rounded text-sm"></select>
        </div>
      </div>

      <!-- 統計 -->
      <div class="bg-gray-900/60 border border-indigo-800/50 rounded-xl p-4 grid grid-cols-2 gap-2 text-center text-xs">
        <div><div class="text-indigo-400">経過時間</div><div id="timer" class="text-white font-mono text-lg">00:00</div></div>
        <div><div class="text-indigo-400">エラー数</div><div id="errorCount" class="text-red-400 font-bold text-lg">0</div></div>
      </div>

      <!-- 数字パッド -->
      <div class="bg-gray-900/60 border border-indigo-800/50 rounded-xl p-4">
        <div class="flex gap-1 mb-2 justify-center">
          <label class="flex items-center gap-1 text-xs text-indigo-400 cursor-pointer">
            <input type="checkbox" id="memoMode" class="accent-indigo-400"> メモモード
          </label>
        </div>
        <div class="numpad grid grid-cols-5 gap-1">
          <button class="bg-gray-700 hover:bg-gray-600 text-white" onclick="inputNum(0)">✕</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(1)">1</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(2)">2</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(3)">3</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(4)">4</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(5)">5</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(6)">6</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(7)">7</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(8)">8</button>
          <button class="bg-indigo-900 hover:bg-indigo-700 text-white" onclick="inputNum(9)">9</button>
        </div>
      </div>

      <!-- アクション -->
      <div class="space-y-2">
        <button onclick="getHint()" class="w-full bg-yellow-700 hover:bg-yellow-600 text-white py-2 rounded-lg text-sm transition">💡 ヒント（1手教える）</button>
        <button onclick="showSolution()" class="w-full bg-purple-700 hover:bg-purple-600 text-white py-2 rounded-lg text-sm transition">👁 解答を見る</button>
        <button onclick="newGame()" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg text-sm transition">🔁 リセット</button>
      </div>

      <!-- 凡例 -->
      <div class="bg-gray-900/60 border border-indigo-800/50 rounded-xl p-3 text-xs text-gray-400 space-y-1">
        <div>🟨 点線: ケージ境界</div>
        <div>左上の数字: ケージ合計</div>
        <div>🟦 青色数字: 所与の数字</div>
        <div>🟩 緑色数字: 入力済み</div>
        <div>右クリック: メモ切替</div>
      </div>
    </div>
  </div>
</div>

<!-- クリアモーダル -->
<div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-gray-900 border border-indigo-600 rounded-2xl p-8 text-center max-w-xs mx-4">
    <div class="text-5xl mb-3">🎉</div>

</div>

// =========================================================
let currentPuzzle = null;
let board = []; // ユーザー入力値 0=空
let memos = []; // [r][c] = Set of numbers
let selectedCell = null;
let errorCount = 0;
let hintUsed = 0;
let timerSec = 0;
let timerInterval = null;
let solved = false;
let cageMap = []; // [r][c] = cage index

function filterPuzzles() {
  const diff = document.getElementById('diffSelect').value;
  const sel = document.getElementById('puzzleSelect');
  sel.innerHTML = '';
  PUZZLES.forEach((p, i) => {
    if (diff === 'all' || p.difficulty === diff) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      sel.appendChild(opt);
    }
  });
  loadPuzzle();
}

function loadPuzzle() {
  const idx = parseInt(document.getElementById('puzzleSelect').value);
  if (isNaN(idx)) return;
  currentPuzzle = PUZZLES[idx];
  initGame();
}

function initGame() {
  const p = currentPuzzle;
  board = Array.from({length:9},()=>Array(9).fill(0));
  memos = Array.from({length:9},()=>Array.from({length:9},()=>new Set()));
  errorCount = 0;
  hintUsed = 0;
  solved = false;
  selectedCell = null;
  document.getElementById('errorCount').textContent = 0;
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('errorMsg').textContent = '';

  // ケージマップ構築
  cageMap = Array.from({length:9},()=>Array(9).fill(-1));
  p.cages.forEach((cage, ci) => {
    cage.cells.forEach(([r,c]) => cageMap[r][c] = ci);
  });

  // 所与の数字を配置
  if (p.given && p.given.length > 0) {
    p.given.forEach(([r,c]) => { board[r][c] = -(p.solution[r][c]); }); // negative = given
  }

  // タイマーリセット
  clearInterval(timerInterval);
  timerSec = 0;
  document.getElementById('timer').textContent = '00:00';
  timerInterval = setInterval(() => {
    timerSec++;
    const m = String(Math.floor(timerSec/60)).padStart(2,'0');
    const s = String(timerSec%60).padStart(2,'0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }, 1000);

  renderGrid();
}

function newGame() { initGame(); }

// =========================================================
// グリッド描画
// =========================================================
function renderGrid() {
  const grid = document.getElementById('sudokuGrid');
  grid.innerHTML = '';
  const p = currentPuzzle;

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;

      // ケージ境界
      const ci = cageMap[r][c];
      if (ci >= 0) {
        const cage = p.cages[ci];
        const inCage = (rr, cc) => cage.cells.some(([ar,ac])=>ar===rr&&ac===cc);
        if (!inCage(r-1,c)) cell.classList.add('cage-top');
        if (!inCage(r+1,c)) cell.classList.add('cage-bottom');
        if (!inCage(r,c-1)) cell.classList.add('cage-left');
        if (!inCage(r,c+1)) cell.classList.add('cage-right');

        // ケージラベル（左上セル）
        const isTopLeft = cage.cells.reduce((tl, [cr,cc]) => {
          if (cr < tl[0] || (cr === tl[0] && cc < tl[1])) return [cr,cc];
          return tl;
        }, cage.cells[0]);
        if (isTopLeft[0]===r && isTopLeft[1]===c) {
          const lbl = document.createElement('div');
          lbl.className = 'cage-label';
          lbl.textContent = cage.sum;
          cell.appendChild(lbl);
        }
      }

      // セル内容
      const val = board[r][c];
      if (val < 0) {
        // 所与
        cell.classList.add('given');
        cell.textContent = '';
        const lbl = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"] .cage-label`);
        cell.appendChild(document.createTextNode(-val));
        if (lbl) cell.prepend(lbl);
      } else if (val > 0) {
        cell.classList.add('user');
        const content = document.createTextNode(val);
        const lbl = cell.querySelector('.cage-label');
        cell.textContent = '';
        if (lbl) cell.appendChild(lbl);
        cell.appendChild(content);
        // エラーチェック
        if (hasConflict(r, c, val)) cell.classList.add('error');
      } else {
        // メモ
        const m = memos[r][c];
        if (m.size > 0) {
          const memoDiv = document.createElement('div');
          memoDiv.className = 'memo';
          for (let n = 1; n <= 9; n++) {
            const sp = document.createElement('span');
            sp.textContent = m.has(n) ? n : '';
            memoDiv.appendChild(sp);
          }
          const lbl = cell.querySelector('.cage-label');
          cell.textContent = '';
          if (lbl) cell.appendChild(lbl);
          cell.appendChild(memoDiv);
        }
      }

      if (selectedCell && selectedCell[0]===r && selectedCell[1]===c) cell.classList.add('selected');

      cell.addEventListener('click', () => selectCell(r, c));
      cell.addEventListener('contextmenu', e => { e.preventDefault(); toggleMemoMode(); });
      grid.appendChild(cell);
    }
  }
}

function selectCell(r, c) {
  selectedCell = [r, c];
  renderGrid();
}

function toggleMemoMode() {
  document.getElementById('memoMode').checked = !document.getElementById('memoMode').checked;
}

// =========================================================
// 入力
// =========================================================
function inputNum(n) {
  if (!selectedCell || solved) return;
  const [r, c] = selectedCell;
  if (board[r][c] < 0) return; // given

  const isMemo = document.getElementById('memoMode').checked;
  if (isMemo && n > 0) {
    if (board[r][c] !== 0) return;
    if (memos[r][c].has(n)) memos[r][c].delete(n);
    else memos[r][c].add(n);
  } else {
    memos[r][c].clear();
    board[r][c] = n;
    if (n > 0 && hasConflict(r,c,n)) {
      errorCount++;
      document.getElementById('errorCount').textContent = errorCount;
    }
  }
  renderGrid();
  checkComplete();
}

document.addEventListener('keydown', e => {
  if (!selectedCell) return;
  const [r,c] = selectedCell;
  const key = e.key;
  if (key >= '1' && key <= '9') { inputNum(parseInt(key)); return; }
  if (key === '0' || key === 'Delete' || key === 'Backspace') { inputNum(0); return; }
  const moves = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if (moves[key]) {
    e.preventDefault();
    const [dr,dc] = moves[key];
    const nr = Math.max(0,Math.min(8,r+dr));
    const nc = Math.max(0,Math.min(8,c+dc));
    selectCell(nr,nc);
  }
});

// =========================================================
// 検証
// =========================================================
function hasConflict(r, c, val) {
  if (val === 0) return false;
  const sol = currentPuzzle.solution;
  // 解答との一致チェックのみ（シンプルかつ確実）
  return sol[r][c] !== val;
}

function checkCageConstraint(ci) {
  const cage = currentPuzzle.cages[ci];
  const vals = cage.cells.map(([r,c]) => Math.abs(board[r][c])).filter(v=>v>0);
  if (vals.length !== cage.cells.length) return true; // incomplete
  const sum = vals.reduce((a,b)=>a+b,0);
  const uniq = new Set(vals).size === vals.length;
  return sum === cage.sum && uniq;
}

function checkComplete() {
  for (let r=0;r<9;r++) for(let c=0;c<9;c++) {
    if (board[r][c] === 0) return;
    if (Math.abs(board[r][c]) !== currentPuzzle.solution[r][c]) return;
  }
  // All cages valid
  for (let ci=0;ci<currentPuzzle.cages.length;ci++) {
    if (!checkCageConstraint(ci)) return;
  }
  solved = true;
  clearInterval(timerInterval);
  const m = String(Math.floor(timerSec/60)).padStart(2,'0');
  const s = String(timerSec%60).padStart(2,'0');
  document.getElementById('clearTime').textContent = `クリア時間: ${m}:${s}`;
  document.getElementById('clearErrors').textContent = `エラー数: ${errorCount}  ヒント数: ${hintUsed}`;
  document.getElementById('modal').classList.remove('hidden');
}

// =========================================================
// ヒント
// =========================================================
function getHint() {
  if (solved) return;
  const sol = currentPuzzle.solution;
  for (let r=0;r<9;r++) for(let c=0;c<9;c++) {
    if (board[r][c] === 0 || (board[r][c] > 0 && board[r][c] !== sol[r][c])) {
      board[r][c] = -sol[r][c]; // treat as given
      memos[r][c].clear();
      hintUsed++;
      selectedCell = [r,c];
      renderGrid();
      document.getElementById('errorMsg').textContent = `💡 ヒント: [${['A','B','C','D','E','F','G','H','I','J'][r]}${c+1}] = ${sol[r][c]}`;
      checkComplete();
      return;
    }
  }
}

function showSolution() {
  if (!confirm('解答を表示しますか？（タイマーが停止します）')) return;
  clearInterval(timerInterval);
  for (let r=0;r<9;r++) for(let c=0;c<9;c++) {
    board[r][c] = -currentPuzzle.solution[r][c];
    memos[r][c].clear();
  }
  solved = true;
  renderGrid();
  document.getElementById('stateLabel') && (document.getElementById('stateLabel').textContent = '解答表示');
}

// =========================================================
// 初期化
// =========================================================
filterPuzzles();
</script>
</body>
</html>
